[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-harness"
version = "1.0.0"
description = "Supervisor-worker-critic desktop and headless control plane for LLM coding agents."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sergey Lebedev" }]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
llm-harness = "llm_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
